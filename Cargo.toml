[package]
name = "x_likes_downloader"
version = "2026.6.0"
edition = "2021"

[lib]
name = "x_likes_downloader"
path = "src/lib.rs"

[[bin]]
name = "x_likes_downloader"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"
regex = "1.9"
anyhow = "1.0"
thiserror = "2"
clap = { version = "4.0", features = ["derive"] }
dotenv = "0.15"
futures-util = "0.3"
indicatif = "0.17"
urlencoding = "2.1"
filetime = "0.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
