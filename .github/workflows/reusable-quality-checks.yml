name: Reusable Quality Checks

on:
  workflow_call:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-quality-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-cargo-

      - name: 代码格式检查
        run: cargo fmt --all -- --check

      - name: Clippy 检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 编译检查
        run: cargo check

      - name: 单元测试
        run: cargo test --lib

      - name: MCP server 集成 smoke 测试
        run: cargo test --test mcp_smoke

  packaging-checks:
    name: Packaging Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证 packaging 元数据 schema
        run: bash scripts/check-packaging.sh

      - name: SOT → host adapter 同步一致性
        run: |
          bash scripts/sync-skill.sh
          if ! git diff --exit-code -- packaging/; then
            echo "::error::SKILL.md 派生副本与 SOT 不一致" >&2
            echo "请在本地运行 'bash scripts/sync-skill.sh' 后提交派生副本变更" >&2
            exit 1
          fi
