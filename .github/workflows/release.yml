name: Release

# 发版流程（决策对齐 pi-extensions 使用的 changesets/action，版本仍是本仓日历号）：
# https://github.com/changesets/action/blob/a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d/src/index.ts
# https://github.com/HerbertGao/pi-extensions/blob/master/.github/workflows/release.yml
# https://github.com/HerbertGao/pi-extensions/blob/master/scripts/version-packages.mjs
# 1) push master：自上一个 tag 之后有 feat/fix 时，按 UTC 日历推导下一版，
#    在固定分支 release/next 上开或更新同一个 release PR。不需要手填版本。
# 2) 合并标题为 chore(release): 版本统一到 N.N.N 的提交后，只打 annotated tag、
#    建 draft Release、构建 6 平台并发布，不再开 PR。
# 3) 没有可发布提交，或该版本 tag 已存在：成功退出。
# 4) 手动推送 vN.N.N tag 仍是恢复路径：跳过版本统一，直接构建并发布。
# 5) workflow_dispatch 的 version 可留空。留空时与 push 一样只准备 PR，不会因此发布。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选。留空则按日历版本自动推导；填写则为 N.N.N（不要前导 v）"
        required: false
        type: string
  push:
    branches: [master]
    tags:
      - "v[0-9]*"

concurrency:
  # prepare 共用一组并取消旧运行，避免两个 push 各开一个 PR。
  # release 提交和 tag 单独成组，且不取消，避免打断已经开始的发布。
  group: "${{ github.ref_type == 'tag' && format('release-publish-tag-{0}', github.ref) || (github.event_name == 'workflow_dispatch' && format('release-prepare-{0}', github.ref)) || (contains(toJSON(github.event.head_commit.message), 'chore(release): 版本统一到') && format('release-publish-{0}', github.sha)) || format('release-prepare-{0}', github.ref) }}"
  cancel-in-progress: "${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch')) && !contains(toJSON(github.event.head_commit.message), 'chore(release): 版本统一到') }}"

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) 判断：prepare / publish / skip
  # ---------------------------------------------------------------------------
  plan:
    name: 解析发布动作
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      branch: ${{ steps.plan.outputs.branch }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 解析动作
        id: plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EXPLICIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
          RELEASE_FETCH_TAGS: "1"
        run: bash scripts/release_plan.sh --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2) 有可发布改动：统一版本号并开/更新同一个 release PR
  #    最小权限：contents: write 用来推 release/next；
  #    pull-requests: write 用来创建或更新 PR。
  #    仓库还必须允许 Actions 创建 PR，否则 gh pr create 会被拒绝。
  # ---------------------------------------------------------------------------
  prepare-release:
    name: 准备 release PR
    needs: plan
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          # 需要 token 推送 release/next。
          persist-credentials: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 开或更新 release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ALLOW_PUSH: "1"
          RELEASE_FETCH_TAGS: "1"
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EXPLICIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
          RELEASE_BASE: ${{ github.event.repository.default_branch }}
        run: bash scripts/release_open_pr.sh

  # ---------------------------------------------------------------------------
  # 3) 质量门禁（仅真正发版时跑）
  # ---------------------------------------------------------------------------
  quality-checks:
    name: Quality Checks
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    uses: ./.github/workflows/reusable-quality-checks.yml

  # ---------------------------------------------------------------------------
  # 4) 打 tag + 建 draft Release
  # ---------------------------------------------------------------------------
  create-release:
    name: 创建 tag 与 Release
    needs: [plan, quality-checks]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.plan.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # 需要 token 推送 annotated tag。
          persist-credentials: true

      - name: 校验 tag 与代码版本一致
        env:
          VER: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cargo_ver=$(
            sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' \
              Cargo.toml | head -1
          )
          [[ "$cargo_ver" == "$VER" ]] || {
            echo "::error file=Cargo.toml::version '$cargo_ver' != tag 'v$VER'"
            exit 1
          }
          skill_md=".agents/skills/x_likes/SKILL.md"
          grep -q "^min_binary_version: $VER$" "$skill_md" || {
            echo "::error file=$skill_md::min_binary_version != $VER"
            exit 1
          }

      - name: 创建 annotated tag
        env:
          VER: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "tag v$VER already exists (recovery path) — skip creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VER" -m "Release v$VER"
            git push origin "refs/tags/v$VER"
          fi

      - name: 检查 Release 是否已存在
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 draft Release
        if: steps.rel.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: x_likes_downloader v${{ needs.plan.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # 5) 构建 6 平台
  # ---------------------------------------------------------------------------
  build:
    name: 构建 ${{ matrix.platform }}
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: x_likes_downloader_linux_x86_64

          - platform: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: x_likes_downloader_linux_arm64

          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: x_likes_downloader_windows_x86_64.exe

          - platform: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: x_likes_downloader_windows_arm64.exe

          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: x_likes_downloader_macos_x86_64

          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: x_likes_downloader_macos_arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: >-
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: 安装交叉编译依赖 (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: 构建
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            linker=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="$linker"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: 准备产物
        shell: bash
        run: |
          mkdir -p dist

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            SRC="target/${{ matrix.target }}/release/x_likes_downloader.exe"
          else
            SRC="target/${{ matrix.target }}/release/x_likes_downloader"
          fi

          if [ ! -f "$SRC" ]; then
            echo "错误：未找到构建产物: $SRC"
            exit 1
          fi

          cp "$SRC" "dist/${{ matrix.artifact_name }}"
          ls -la dist/

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 6) 上传产物 + 发布（draft → published）
  # ---------------------------------------------------------------------------
  publish:
    name: 上传产物并发布
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: 上传并发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: dist/*
          draft: false

      - name: 写入下载表格
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 没有 checkout；显式指定仓库，避免 gh 依赖 git remote。
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          l64="$BASE_URL/x_likes_downloader_linux_x86_64"
          m64="$BASE_URL/x_likes_downloader_macos_x86_64"
          w64="$BASE_URL/x_likes_downloader_windows_x86_64.exe"
          la="$BASE_URL/x_likes_downloader_linux_arm64"
          ma="$BASE_URL/x_likes_downloader_macos_arm64"
          wa="$BASE_URL/x_likes_downloader_windows_arm64.exe"
          hdr="| 架构 | Linux | macOS | Windows |"
          sep="|------|-------|-------|---------|"
          r64="| x86_64 | [下载]($l64) | [下载]($m64) | [下载]($w64) |"
          ra="| ARM64 | [下载]($la) | [下载]($ma) | [下载]($wa) |"
          DOWNLOAD_TABLE=$(
            printf '## 下载\n\n%s\n%s\n%s\n%s\n\n' \
              "$hdr" "$sep" "$r64" "$ra"
          )
          CURRENT_BODY=$(gh release view "v${VERSION}" --json body -q '.body')
          if [[ "$CURRENT_BODY" == "## 下载"* ]]; then
            echo "download table already present — skipping"
            exit 0
          fi
          printf '%s\n\n## 更新日志\n\n%s\n' \
            "$DOWNLOAD_TABLE" "$CURRENT_BODY" |
            gh release edit "v${VERSION}" --notes-file -
